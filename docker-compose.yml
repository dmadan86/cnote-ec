# Local infrastructure only (Postgres + pgvector, Redis; optional OpenSearch and MinIO via profiles).
# Every published port is bound to 127.0.0.1 (security audit): nothing here is reachable from the network. Redis requires a password
# (REDIS_PASSWORD, default `cnote-dev-redis`, LOCAL DEV ONLY): REDIS_URL=redis://:cnote-dev-redis@localhost:6379 (see .env.example).
# Images are pinned by digest; refresh with `docker buildx imagetools inspect <image:tag>` (or let Dependabot's docker ecosystem do it).
# Apps run on the host with `pnpm dev`, or in containers with docker-compose.apps.yml (see README).
#   docker compose up -d                              # postgres + redis
#   docker compose --profile search up -d opensearch  # SEARCH_BACKEND=opensearch contract tests
#   docker compose --profile storage up -d minio minio-init   # MEDIA_DRIVER=s3 testing
name: cnote
services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: cnote
      POSTGRES_PASSWORD: cnote
      POSTGRES_DB: cnote
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate LIVE read database (CQRS) on first boot of an empty volume.
      - ./deploy/docker/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cnote -d cnote"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    ports: ["127.0.0.1:6379:6379"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-cnote-dev-redis}
    # The password is read from the environment at start (not in the process list of the host; `ps` inside the container shows it, which is fine for dev).
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 20

  # Optional: SEARCH_BACKEND=opensearch. Single node, security plugin disabled for local use only.
  opensearch:
    profiles: ["search"]
    image: opensearchproject/opensearch:3.9.0@sha256:adfa61f85025d06b4aeb562e7e74fde7e31c437039c93c3862c17e9acebd6c7c
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:9200:9200"]
    volumes:
      - osdata:/usr/share/opensearch/data
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Optional: S3-compatible storage for MEDIA_DRIVER=s3 (MEDIA_ENDPOINT=http://localhost:9000, MEDIA_REGION=us-east-1,
  # MEDIA_ACCESS_KEY_ID=cnote, MEDIA_SECRET_ACCESS_KEY=cnote-secret-key, MEDIA_BUCKET=cnote-public, MEDIA_PRIVATE_BUCKET=cnote-private).
  minio:
    profiles: ["storage"]
    # TODO(supply-chain): pin by digest. MinIO stopped publishing its community images to Docker Hub/Quay (the public registry API now
    # answers 401 for minio/minio and minio/mc), so no digest could be resolved when this was written. Pick the build you vetted
    # (mirror it into your own registry) and pin it:  docker buildx imagetools inspect <registry>/minio/minio:<RELEASE tag>
    # then use  image: <registry>/minio/minio:<RELEASE tag>@sha256:<digest>.  Never `latest`.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: cnote
      MINIO_ROOT_PASSWORD: cnote-secret-key
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio-init:
    profiles: ["storage"]
    # TODO(supply-chain): pin by digest, same as minio above.
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 cnote cnote-secret-key &&
      mc mb --ignore-existing local/cnote-public local/cnote-private &&
      mc anonymous set download local/cnote-public"
    restart: "no"

volumes:
  pgdata:
  redisdata:
  osdata:
  miniodata:
