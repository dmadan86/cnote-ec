services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: cnote
      POSTGRES_PASSWORD: cnote
      POSTGRES_DB: cnote
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cnote"]
      interval: 2s
      retries: 20
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
