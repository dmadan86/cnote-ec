# Local infrastructure only (Postgres + pgvector, Redis; optional OpenSearch and MinIO via profiles).
# Apps run on the host with `pnpm dev`, or in containers with docker-compose.apps.yml (see README).
#   docker compose up -d                              # postgres + redis
#   docker compose --profile search up -d opensearch  # SEARCH_BACKEND=opensearch contract tests
#   docker compose --profile storage up -d minio minio-init   # MEDIA_DRIVER=s3 testing
name: cnote
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: cnote
      POSTGRES_PASSWORD: cnote
      POSTGRES_DB: cnote
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate LIVE read database (CQRS) on first boot of an empty volume.
      - ./deploy/docker/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cnote -d cnote"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Optional: SEARCH_BACKEND=opensearch. Single node, security plugin disabled for local use only.
  opensearch:
    profiles: ["search"]
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes:
      - osdata:/usr/share/opensearch/data
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Optional: S3-compatible storage for MEDIA_DRIVER=s3 (MEDIA_ENDPOINT=http://localhost:9000, MEDIA_REGION=us-east-1,
  # MEDIA_ACCESS_KEY_ID=cnote, MEDIA_SECRET_ACCESS_KEY=cnote-secret-key, MEDIA_BUCKET=cnote-public, MEDIA_PRIVATE_BUCKET=cnote-private).
  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: cnote
      MINIO_ROOT_PASSWORD: cnote-secret-key
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio-init:
    profiles: ["storage"]
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 cnote cnote-secret-key &&
      mc mb --ignore-existing local/cnote-public local/cnote-private &&
      mc anonymous set download local/cnote-public"
    restart: "no"

volumes:
  pgdata:
  redisdata:
  osdata:
  miniodata:
