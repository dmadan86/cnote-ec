name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read the repo. Jobs needing more declare it themselves.
permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cnote
          POSTGRES_PASSWORD: cnote
          POSTGRES_DB: cnote
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cnote"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote
      LIVE_DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote_live
      REDIS_URL: redis://localhost:6379
      # CI databases are ephemeral: tests use them directly (locally they use isolated *_test DBs, see vitest.setup.ts)
      TEST_DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote
      TEST_LIVE_DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote_live
      TEST_REDIS_URL: redis://localhost:6379
      AI_PROVIDER: heuristic
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      APP_URL: http://localhost:3000
      OTP_DEV_ECHO: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create live database
        run: PGPASSWORD=cnote psql -h localhost -U cnote -d cnote -c 'CREATE DATABASE cnote_live'
      - name: Migrations
        run: |
          pnpm db:check
          pnpm db:migrate
          pnpm --filter @cnote/live-db migrate:deploy
      - run: pnpm typecheck
      - name: Module boundaries
        run: pnpm check:boundaries && pnpm test:boundaries
      - run: pnpm lint
      # Unit tests with per-package coverage thresholds enforced (vitest.shared.ts); fails the build on either.
      - name: Unit tests + coverage thresholds
        run: pnpm test:coverage
      - name: Build all workspaces (web, seller, admin, studio)
        run: pnpm build
      # The api and worker have no build step (tsx runtime); typecheck above covers them. Explicit for clarity.
      - name: Typecheck api and worker
        run: pnpm --filter @cnote/api --filter @cnote/worker typecheck

  # Only builds when a Docker-related file changed. No push, no registry login.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docker:
              - '.dockerignore'
              - 'apps/*/Dockerfile'
              - 'deploy/docker/**'
              - 'infra/docker/**'
              - 'docker-compose*.yml'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'

  docker:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # postinstall runs prisma generate for both schemas, which resolves these at config-load time
      DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote
      LIVE_DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote_live
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web, file: apps/web/Dockerfile }
          - { name: seller, file: apps/seller/Dockerfile }
          - { name: admin, file: apps/admin/Dockerfile }
          - { name: studio, file: apps/studio/Dockerfile }
          - { name: api, file: apps/api/Dockerfile }
          - { name: worker, file: apps/worker/Dockerfile }
          - { name: ai-service, file: apps/ai-service/Dockerfile }
          - { name: search-service, file: apps/search-service/Dockerfile }
          - { name: migrate, file: deploy/docker/migrate.Dockerfile }
    services:
      # Next builds call generateStaticParams against the database (apps/web), so the build container reaches this one.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cnote
          POSTGRES_PASSWORD: cnote
          POSTGRES_DB: cnote
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cnote"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate (Next builds read both schemas)
        run: |
          PGPASSWORD=cnote psql -h localhost -U cnote -d cnote -c 'CREATE DATABASE cnote_live'
          pnpm db:migrate
          pnpm --filter @cnote/live-db migrate:deploy
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.name }} (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          # host network: the build stage reaches the service containers on localhost.
          network: host
          build-args: |
            DATABASE_URL=postgres://cnote:cnote@localhost:5432/cnote
            LIVE_DATABASE_URL=postgres://cnote:cnote@localhost:5432/cnote_live
            REDIS_URL=redis://localhost:6379
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Scale/DR work (ADR-018, ADR-023): service contract tests, analytics projections, DR tooling, manifests and API-doc drift.
  # (The `check` job above also runs their unit tests + coverage through the workspace-wide scripts.)
  scale-services:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cnote
          POSTGRES_PASSWORD: cnote
          POSTGRES_DB: cnote
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cnote"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote
      LIVE_DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote_live
      REDIS_URL: redis://localhost:6379
      TEST_DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote
      TEST_LIVE_DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote_live
      TEST_REDIS_URL: redis://localhost:6379
      AI_PROVIDER: heuristic
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations
        run: |
          PGPASSWORD=cnote psql -h localhost -U cnote -d cnote -c 'CREATE DATABASE cnote_live'
          pnpm db:migrate
          pnpm --filter @cnote/live-db migrate:deploy
      - name: Service contracts (in-process === over HTTP) with coverage
        run: |
          pnpm --filter @cnote/ai exec vitest run --coverage
          pnpm --filter @cnote/search exec vitest run test/remote.test.ts
          pnpm --filter @cnote/ai-service exec vitest run --coverage
          pnpm --filter @cnote/search-service exec vitest run --coverage
      - name: Analytics projections (exactly-once, resumable, replay)
        run: pnpm --filter @cnote/analytics exec vitest run --coverage
      - name: DR tooling unit tests (dr-check)
        run: pnpm test:ops
      - name: OpenAPI documents are up to date
        run: |
          pnpm --filter @cnote/ai-service openapi
          pnpm --filter @cnote/search-service openapi
          git diff --exit-code docs/design/ai-service.openapi.json docs/design/search-service.openapi.json
      - name: Postgres DR drill on scratch clusters (WAL archive, PITR, replica, promote, pg_rewind)
        run: |
          # the runner image ships PostgreSQL server binaries (initdb, pg_basebackup, pg_rewind, pg_verifybackup)
          PGBIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" bash infra/postgres/dr-drill.sh
      - name: Kubernetes overlays render
        run: |
          for o in infra/k8s/overlays/*; do kubectl kustomize "$o" > /dev/null; done
      - name: Compose file validates
        run: REGISTRY=r TAG=t CNOTE_ENV_FILE=/dev/null docker compose -f infra/compose/docker-compose.prod.yml --profile primary config > /dev/null

  # Optional: runs only when the repository has an OPENSEARCH_URL secret (a reachable test cluster).
  # Secrets cannot be used in `if:` directly, so the job exposes it via an env check step.
  opensearch-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENSEARCH_URL: ${{ secrets.OPENSEARCH_URL }}
      OPENSEARCH_USERNAME: ${{ secrets.OPENSEARCH_USERNAME }}
      OPENSEARCH_PASSWORD: ${{ secrets.OPENSEARCH_PASSWORD }}
      SEARCH_BACKEND: opensearch
      DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cnote
          POSTGRES_PASSWORD: cnote
          POSTGRES_DB: cnote
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cnote"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    steps:
      - name: Skip when no OpenSearch cluster is configured
        id: gate
        run: |
          if [ -z "$OPENSEARCH_URL" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "OPENSEARCH_URL secret not set; skipping"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.run == 'true'
        run: pnpm db:migrate
      - name: Search contract tests against OpenSearch
        if: steps.gate.outputs.run == 'true'
        run: pnpm --filter @cnote/search test
