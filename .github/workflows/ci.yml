name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read the repo. Jobs needing more declare it themselves.
permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cnote
          POSTGRES_PASSWORD: cnote
          POSTGRES_DB: cnote
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cnote"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote
      LIVE_DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote_live
      REDIS_URL: redis://localhost:6379
      # CI databases are ephemeral: tests use them directly (locally they use isolated *_test DBs, see vitest.setup.ts)
      TEST_DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote
      TEST_LIVE_DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote_live
      TEST_REDIS_URL: redis://localhost:6379
      AI_PROVIDER: heuristic
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      APP_URL: http://localhost:3000
      OTP_DEV_ECHO: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create live database
        run: PGPASSWORD=cnote psql -h localhost -U cnote -d cnote -c 'CREATE DATABASE cnote_live'
      - name: Migrations
        run: |
          pnpm db:check
          pnpm db:migrate
          pnpm --filter @cnote/live-db migrate:deploy
          # Test cleanup deletes from the DB-level append-only tables (security audit M5); UPDATE stays blocked. Ephemeral CI database only.
          bash scripts/allow-test-purge.sh "$TEST_DATABASE_URL"
      - run: pnpm typecheck
      - name: Module boundaries
        run: pnpm check:boundaries && pnpm test:boundaries
      - run: pnpm lint
      # Unit tests with per-package coverage thresholds enforced (vitest.shared.ts); fails the build on either.
      - name: Unit tests + coverage thresholds
        run: pnpm test:coverage
      - name: Build all workspaces (web, seller, admin, studio)
        run: pnpm build
      # The api and worker have no build step (tsx runtime); typecheck above covers them. Explicit for clarity.
      - name: Typecheck api and worker
        run: pnpm --filter @cnote/api --filter @cnote/worker typecheck

  # UI tests (docs/guides/testing.md): axe WCAG 2.2 AA scans + keyboard checks (`pnpm test:a11y`) and user journeys
  # (`pnpm test:e2e`) against production builds of the buyer web and seller apps, on dedicated *_e2e databases.
  # Separate from `check` so it can be made a required status check independently.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cnote
          POSTGRES_PASSWORD: cnote
          POSTGRES_DB: cnote
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cnote"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Database / Redis / HUMAN_VERIFIER=off / AI_PROVIDER=heuristic etc. are set by e2e/support/env.ts (defaults match
      # the services above: cnote_e2e, cnote_live_e2e, Redis logical DB 2). Only the build needs a workspace-level hint.
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # postinstall runs prisma generate for both schemas, which resolves these at config-load time (the e2e databases)
      DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote_e2e
      LIVE_DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote_live_e2e
      # Legal entity details: the e2e web server runs NODE_ENV=production, where they are required (features/legal/entity.ts).
      PLATFORM_LEGAL_NAME: Example Commerce Private Limited
      PLATFORM_CIN: U74999KA2026PTC000001
      PLATFORM_GSTIN: 29ABCDE1234F1Z5
      PLATFORM_ADDRESS: 1 MG Road, Bengaluru, Karnataka 560001
      SUPPORT_EMAIL: support@example.in
      SUPPORT_PHONE: "+91 80 1234 5678"
      SUPPORT_WHATSAPP: "+91 98765 43210"
      SUPPORT_HOURS: Mon-Sat, 9:00 to 18:00 IST
      SECURITY_CONTACT_EMAIL: security@example.in
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - name: Prepare e2e databases and build web + seller
        run: pnpm test:e2e:build
      # One invocation so the servers start once: a11y (e2e/a11y) and journeys (e2e/functional), desktop + mobile projects.
      - name: Accessibility + end-to-end tests
        run: pnpm exec playwright test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload traces and screenshots (failures)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: e2e/.results/
          retention-days: 14

  # Only builds when a Docker-related file changed. No push, no registry login.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docker:
              - '.dockerignore'
              - 'apps/*/Dockerfile'
              - 'deploy/docker/**'
              - 'infra/docker/**'
              - 'docker-compose*.yml'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'

  docker:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # postinstall runs prisma generate for both schemas, which resolves these at config-load time
      DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote
      LIVE_DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote_live
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web, file: apps/web/Dockerfile }
          - { name: seller, file: apps/seller/Dockerfile }
          - { name: admin, file: apps/admin/Dockerfile }
          - { name: studio, file: apps/studio/Dockerfile }
          - { name: api, file: apps/api/Dockerfile }
          - { name: worker, file: apps/worker/Dockerfile }
          - { name: ai-service, file: apps/ai-service/Dockerfile }
          - { name: search-service, file: apps/search-service/Dockerfile }
          - { name: migrate, file: deploy/docker/migrate.Dockerfile }
    services:
      # Next builds call generateStaticParams against the database (apps/web), so the build container reaches this one.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cnote
          POSTGRES_PASSWORD: cnote
          POSTGRES_DB: cnote
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cnote"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate (Next builds read both schemas)
        run: |
          PGPASSWORD=cnote psql -h localhost -U cnote -d cnote -c 'CREATE DATABASE cnote_live'
          pnpm db:migrate
          pnpm --filter @cnote/live-db migrate:deploy
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # the build stage must reach the Postgres/Redis service containers on localhost (Next static generation)
          # BuildKit runs in its own container: give it the runner's network, then allow RUN steps to use it
          driver-opts: network=host
          buildkitd-flags: --allow-insecure-entitlement network.host
      - name: Write the build secret (throwaway CI service URLs)
        run: |
          printf '%s\n' \
            'DATABASE_URL=postgres://cnote:cnote@localhost:5432/cnote' \
            'LIVE_DATABASE_URL=postgres://cnote:cnote@localhost:5432/cnote_live' \
            'REDIS_URL=redis://localhost:6379' > "$RUNNER_TEMP/build.env"
      - name: Build ${{ matrix.name }} (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          # host network: the build stage reaches the service containers on localhost.
          network: host
          allow: network.host
          # Credentials never travel as build args (they are stored in the image history): the Dockerfiles read them from this build secret.
          secret-files: |
            build_env=${{ runner.temp }}/build.env
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Scale/DR work (ADR-018, ADR-023): service contract tests, analytics projections, DR tooling, manifests and API-doc drift.
  # (The `check` job above also runs their unit tests + coverage through the workspace-wide scripts.)
  scale-services:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cnote
          POSTGRES_PASSWORD: cnote
          POSTGRES_DB: cnote
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cnote"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote
      LIVE_DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote_live
      REDIS_URL: redis://localhost:6379
      TEST_DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote
      TEST_LIVE_DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote_live
      TEST_REDIS_URL: redis://localhost:6379
      AI_PROVIDER: heuristic
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations
        run: |
          PGPASSWORD=cnote psql -h localhost -U cnote -d cnote -c 'CREATE DATABASE cnote_live'
          pnpm db:migrate
          pnpm --filter @cnote/live-db migrate:deploy
          bash scripts/allow-test-purge.sh "$TEST_DATABASE_URL"   # ephemeral CI database: see scripts/allow-test-purge.sh
      - name: Service contracts (in-process === over HTTP) with coverage
        run: |
          pnpm --filter @cnote/ai exec vitest run --coverage
          pnpm --filter @cnote/search exec vitest run test/remote.test.ts
          pnpm --filter @cnote/ai-service exec vitest run --coverage
          pnpm --filter @cnote/search-service exec vitest run --coverage
      - name: Analytics projections (exactly-once, resumable, replay)
        run: pnpm --filter @cnote/analytics exec vitest run --coverage
      - name: DR tooling unit tests (dr-check)
        run: pnpm test:ops
      - name: OpenAPI documents are up to date
        run: |
          pnpm --filter @cnote/ai-service openapi
          pnpm --filter @cnote/search-service openapi
          git diff --exit-code docs/design/ai-service.openapi.json docs/design/search-service.openapi.json
      - name: Postgres DR drill on scratch clusters (WAL archive, PITR, replica, promote, pg_rewind)
        run: |
          # the runner image ships PostgreSQL server binaries (initdb, pg_basebackup, pg_rewind, pg_verifybackup)
          PGBIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" bash infra/postgres/dr-drill.sh
      - name: Kubernetes overlays render
        run: |
          for o in infra/k8s/overlays/*; do kubectl kustomize "$o" > /dev/null; done
      - name: Compose file validates
        run: REGISTRY=r TAG=t CNOTE_ENV_FILE=/dev/null docker compose -f infra/compose/docker-compose.prod.yml --profile primary config > /dev/null

  # Optional: runs only when the repository has an OPENSEARCH_URL secret (a reachable test cluster).
  # Secrets cannot be used in `if:` directly, so the job exposes it via an env check step.
  opensearch-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENSEARCH_URL: ${{ secrets.OPENSEARCH_URL }}
      OPENSEARCH_USERNAME: ${{ secrets.OPENSEARCH_USERNAME }}
      OPENSEARCH_PASSWORD: ${{ secrets.OPENSEARCH_PASSWORD }}
      SEARCH_BACKEND: opensearch
      DATABASE_URL: postgres://cnote:cnote@localhost:5432/cnote
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cnote
          POSTGRES_PASSWORD: cnote
          POSTGRES_DB: cnote
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cnote"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    steps:
      - name: Skip when no OpenSearch cluster is configured
        id: gate
        run: |
          if [ -z "$OPENSEARCH_URL" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "OPENSEARCH_URL secret not set; skipping"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.run == 'true'
        run: pnpm db:migrate
      - name: Search contract tests against OpenSearch
        if: steps.gate.outputs.run == 'true'
        run: pnpm --filter @cnote/search test
