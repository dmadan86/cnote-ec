# Automated dependency + supply-chain updates. Security advisories are raised regardless of schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react*", "eslint-config-next"]
      sentry:
        patterns: ["@sentry/*"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
    # Hold majors the toolchain can't take yet (review when typescript-eslint / eslint-plugin-jsx-a11y add support);
    # @types/node tracks the Node runtime major used in CI and engines.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # one PR for all action bumps (they touch the same workflow files and would otherwise conflict)
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
  # Base images are pinned by digest (node:22-bookworm-slim@sha256:...): Dependabot bumps the tag and the digest together.
  - package-ecosystem: docker
    directories:
      - /apps/web
      - /apps/seller
      - /apps/admin
      - /apps/studio
      - /apps/api
      - /apps/worker
      - /apps/ai-service
      - /apps/search-service
      - /deploy/docker
      - /infra/docker
    schedule:
      interval: weekly
    labels: ["dependencies"]
