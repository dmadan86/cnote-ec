# Postgres 17 streaming replica (ap-south-2). primary_conninfo is written by `pg_basebackup -R` (see docs/ops/backup-restore.md).
hot_standby = on
hot_standby_feedback = on
primary_slot_name = 'region_b'
restore_command = 'pgbackrest --stanza=cnote archive-get %f "%p"'   # lets the replica catch up from the archive after a long disconnect
recovery_min_apply_delay = 0        # set e.g. 15min for a "delayed replica" that survives an instant destructive change
