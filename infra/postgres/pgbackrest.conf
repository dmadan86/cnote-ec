# /etc/pgbackrest/pgbackrest.conf (self-managed Postgres). Repository in an INDIA-region S3-compatible bucket (ADR-010);
# repo2 is the SAME bucket family in the OTHER India region so a regional loss cannot take the backups with it.
[global]
repo1-type=s3
repo1-s3-endpoint=s3.ap-south-1.amazonaws.com
repo1-s3-region=ap-south-1
repo1-s3-bucket=cnote-pg-backup-aps1
repo1-path=/pgbackrest
repo1-retention-full=4
repo1-retention-diff=14
repo1-retention-archive=14
repo1-cipher-type=aes-256-cbc
repo2-type=s3
repo2-s3-endpoint=s3.ap-south-2.amazonaws.com
repo2-s3-region=ap-south-2
repo2-s3-bucket=cnote-pg-backup-aps2
repo2-path=/pgbackrest
repo2-retention-full=4
repo2-cipher-type=aes-256-cbc
# cipher passes and S3 keys come from the secrets manager (repoN-cipher-pass, repoN-s3-key, repoN-s3-key-secret), never from this file.
start-fast=y
compress-type=zst
process-max=4
archive-async=y

[cnote]
pg1-path=/var/lib/postgresql/17/main
