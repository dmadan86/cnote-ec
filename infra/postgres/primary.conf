# Postgres 17 primary (ap-south-1). Managed services expose the same settings as parameter-group values
# (RDS/Aurora: rds.logical_replication not needed; archive_* are managed by the service's PITR, keep 7-35 days retention).
# Self-managed: include this file from postgresql.conf and use pgbackrest.conf for archiving.
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 2GB                 # slack for a replica that reconnects after a short outage
wal_log_hints = on                  # required by pg_rewind (failback) unless data checksums are on
hot_standby = on
hot_standby_feedback = on           # keeps vacuum from removing rows a long replica query needs
archive_mode = on
archive_timeout = 60s               # bounds RPO of the PITR archive to ~60s even on an idle primary
archive_command = 'pgbackrest --stanza=cnote archive-push %p'
synchronous_commit = on             # local durability; the replica is ASYNC on purpose (RPO <= 60s, no write stall if region B is down)
max_slot_wal_keep_size = 20GB       # a dead replica must never fill the primary's disk
