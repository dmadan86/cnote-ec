# Redis 8 replica in ap-south-2. Redis holds ONLY derived/ephemeral state (cache, rate limits, session-revocation set, the
# event stream that the Postgres outbox re-fills): losing it costs a cold cache, never data. Async replication is sufficient.
replicaof redis-primary.ap-south-1.internal 6379
masterauth ${REDIS_PASSWORD}
replica-read-only yes
replica-serve-stale-data yes
appendonly yes
# After promotion (failover) run: REPLICAOF NO ONE   -- then republish unpublished outbox rows automatically (relay is idempotent).
