# AI-Orchestration service (ADR-018). Stateless; holds the model-vendor credentials; no database access.
# Scales on CPU and in-flight requests; the service sheds load with 503 (clients fall back to the in-process heuristic).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnote-ai-service
  labels: {app.kubernetes.io/name: cnote-ai-service, app.kubernetes.io/part-of: cnote, cnote.io/tier: ai}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: cnote-ai-service}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cnote-ai-service, app.kubernetes.io/part-of: cnote, cnote.io/tier: ai}
    spec:
      # Vendor calls can take ~15s: give in-flight requests time to finish on rollout / scale-in.
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: cnote-ai-service}
      containers:
        - name: ai-service
          image: cnote-ai-service
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - {name: http, containerPort: 3005}
          env:
            - {name: PORT, value: "3005"}
            - {name: AI_TRANSPORT, value: inproc}   # the service IS the in-process implementation
            - {name: AI_SERVICE_MAX_INFLIGHT, value: "48"}
          envFrom:
            - configMapRef: {name: cnote-config}
            - secretRef: {name: cnote-secrets}       # AI_SERVICE_TOKEN_SECRET, ANTHROPIC_API_KEY, SARVAM_API_KEY
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "2", memory: 1Gi}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: cnote-ai-service
  labels: {app.kubernetes.io/name: cnote-ai-service}
spec:
  selector: {app.kubernetes.io/name: cnote-ai-service}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# HPA: scale out on CPU (heuristic + embedding work) with a fast scale-up and a slow, drained scale-in.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cnote-ai-service
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: cnote-ai-service}
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
    - type: Resource
      resource: {name: memory, target: {type: Utilization, averageUtilization: 80}}
    # With a metrics adapter (prometheus-adapter/KEDA) also scale on saturation; uncomment once exposed:
    # - type: Pods
    #   pods: {metric: {name: cnote_ai_service_inflight}, target: {type: AverageValue, averageValue: "24"}}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - {type: Percent, value: 100, periodSeconds: 30}
        - {type: Pods, value: 4, periodSeconds: 30}
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - {type: Percent, value: 25, periodSeconds: 60}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cnote-ai-service
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: cnote-ai-service}
