apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnote-admin
  labels: {app.kubernetes.io/name: cnote-admin, app.kubernetes.io/part-of: cnote}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: cnote-admin}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cnote-admin, app.kubernetes.io/part-of: cnote}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: cnote-admin}
      containers:
        - name: admin
          image: cnote-admin
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports:
            - {name: http, containerPort: 3001}
          env:
            - {name: PORT, value: "3001"}
          envFrom:
            - configMapRef: {name: cnote-config}
            - secretRef: {name: cnote-secrets}
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: cnote-admin
  labels: {app.kubernetes.io/name: cnote-admin}
spec:
  selector: {app.kubernetes.io/name: cnote-admin}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cnote-admin
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: cnote-admin}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cnote-admin
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: cnote-admin}
