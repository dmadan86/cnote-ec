apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnote-worker
  labels: {app.kubernetes.io/name: cnote-worker, app.kubernetes.io/part-of: cnote}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: cnote-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cnote-worker, app.kubernetes.io/part-of: cnote}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: cnote-worker}
      containers:
        - name: worker
          image: cnote-worker
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env: []
          envFrom:
            - configMapRef: {name: cnote-config}
            - secretRef: {name: cnote-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          # No HTTP port: the worker is a long-lived loop; k8s restarts it if the process exits.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cnote-worker
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: cnote-worker}
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cnote-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: cnote-worker}
