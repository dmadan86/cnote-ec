# Run BEFORE rolling out app Deployments (Argo CD PreSync hook / `kubectl apply -f` then `kubectl wait --for=condition=complete`).
# Delete the finished Job (or rely on ttlSecondsAfterFinished) before the next release; Job specs are immutable.
apiVersion: batch/v1
kind: Job
metadata:
  name: cnote-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: cnote-migrate, app.kubernetes.io/part-of: cnote}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: cnote-migrate
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          envFrom:
            - secretRef: {name: cnote-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
