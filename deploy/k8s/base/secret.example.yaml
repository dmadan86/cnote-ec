# TEMPLATE ONLY, NOT part of kustomization.yaml. Create the real Secret out of band (sealed-secrets, External Secrets
# Operator, or `kubectl create secret generic cnote-secrets --from-env-file=...`). Never commit values.
apiVersion: v1
kind: Secret
metadata:
  name: cnote-secrets
type: Opaque
stringData:
  DATABASE_URL: ""            # postgres://user:pass@host:5432/cnote?sslmode=require
  LIVE_DATABASE_URL: ""       # separate DB (may be another cluster)
  REDIS_URL: ""               # rediss://...
  JWT_SECRET: ""              # openssl rand -base64 48
  JWT_SECRET_SELLER: ""
  REVALIDATE_SECRET: ""
  MEDIA_ACCESS_KEY_ID: ""
  MEDIA_SECRET_ACCESS_KEY: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  ANTHROPIC_API_KEY: ""
  SENTRY_DSN: ""
