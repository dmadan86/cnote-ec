# TEMPLATE ONLY, NOT part of kustomization.yaml. Create the real Secret out of band (sealed-secrets, External Secrets
# Operator, or `kubectl create secret generic cnote-secrets --from-env-file=...`). Never commit values.
apiVersion: v1
kind: Secret
metadata:
  name: cnote-secrets
type: Opaque
stringData:
  # Startup validation (packages/security/src/secrets.ts, NODE_ENV=production) REFUSES TO START the app when any of these is wrong:
  DATABASE_URL: ""            # postgres://user:pass@host:5432/cnote?sslmode=require   (TLS required: sslmode=require|verify-full; DB_TLS_OPTIONAL=1 only on a documented private network)
  LIVE_DATABASE_URL: ""       # separate DB (may be another cluster), same TLS rule. No localhost fallback exists in production.
  REDIS_URL: ""               # rediss://...  (TLS required; REDIS_TLS_OPTIONAL=1 only on a documented private network)
  JWT_SECRET: ""              # openssl rand -base64 48
  JWT_SECRET_SELLER: ""
  REVALIDATE_SECRET: ""       # openssl rand -base64 32  (32+ characters when set; weak values are rejected)
  # Webhook secrets: REQUIRED for every provider you enable (the matching flag/provider is set in the ConfigMap):
  RAZORPAY_WEBHOOK_SECRET: ""   # PAYMENTS_PROVIDER=razorpay
  CASHFREE_WEBHOOK_SECRET: ""   # PAYMENTS_PROVIDER=cashfree
  ESCROW_WEBHOOK_SECRET: ""     # ESCROW_ENABLED=true
  CREDIT_WEBHOOK_SECRET: ""     # CREDIT_ENABLED=true
  KYC_WEBHOOK_SECRET: ""        # KYC_PROVIDER other than mock
  WHATSAPP_APP_SECRET: ""       # WhatsApp Cloud API enabled (WHATSAPP_ACCESS_TOKEN set)
  WHATSAPP_VERIFY_TOKEN: ""     # ditto
  DOMAIN_CHECK_SECRET: ""       # custom domains enabled (EDGE_PROVIDER=cloudflare|vercel|aws or DOMAINS_HTTP_PROBE=true)
  # Never set in production: OTP_DEV_ECHO=true (rejected), CSP_REPORT_ONLY=1 without CSP_REPORT_ONLY_ACK=1 (rejected).
  MEDIA_ACCESS_KEY_ID: ""
  MEDIA_SECRET_ACCESS_KEY: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  ANTHROPIC_API_KEY: ""
  SENTRY_DSN: ""
